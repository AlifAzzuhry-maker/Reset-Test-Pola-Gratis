<style>
:root{--bg:#f6f3ee;--card:#fff;--tx:#2b2a28;--mu:#6f6b64;--ac:#3f6b5e;--ac2:#e3ede9;--bd:#e4dfd6;--wa:#25804f;

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c1b;--card:#252726;--tx:#ecebe7;--mu:#a09c94;--ac:#7fb3a3;--ac2:#2c3a36;--bd:#38403d;--wa:#4caf7a}}
:root[data-theme="dark"]{--bg:#1b1c1b;--card:#252726;--tx:#ecebe7;--mu:#a09c94;--ac:#7fb3a3;--ac2:#2c3a36;--bd:#38403d;--wa:#4caf7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Georgia,'Times New Roman',serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{line-height:1.25;margin:0 0 10px}
h1{font-size:28px}h2{font-size:22px}h3{font-size:17px}
.sans,button,.tag{font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin:14px 0}
.mu{color:var(--mu)}.small{font-size:14px}
.tag{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);background:var(--ac2);padding:3px 10px;border-radius:99px;margin-bottom:10px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;background:var(--ac);color:#fff;cursor:pointer;margin:8px 0}
.btn.alt{background:var(--ac2);color:var(--ac)}
.btn.wa{background:var(--wa)}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:15px;cursor:pointer}
.opt b{min-width:26px;height:26px;border-radius:50%;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-size:14px}
.opt:hover,.opt.on{border-color:var(--ac);background:var(--ac2)}
.q{font-size:20px;line-height:1.45}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-family:system-ui,sans-serif;margin-top:8px}
.quote{font-style:italic;color:var(--mu)}
.lbl{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:14px 0 2px}
.exp{background:var(--ac2);border-radius:12px;padding:14px;margin-top:14px}
.hide{display:none}.inp{width:100%;padding:12px 14px;margin:6px 0;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}.chk{display:flex;gap:8px;align-items:flex-start;margin:8px 0}.chk input{margin-top:5px}
</style>
</head>

const Q=["Saat diremehkan atau dibandingkan dengan orang lain, aku ingin segera menunjukkan bahwa aku mampu.","Aku mengiyakan permintaan orang lain padahal sebenarnya ingin menolak.","Ketika rencana berubah mendadak, aku merasa tegang dan ingin segera mengatur ulang semuanya.","Saat ada tugas atau percakapan yang tidak nyaman, aku mengalihkan diri ke HP, kesibukan lain, atau menunda.","Setelah melakukan kesalahan, aku mengulang-ulang kesalahan itu di kepala dan menyalahkan diri sendiri.","Saat ada masalah di sekitarku, aku otomatis mengambil beban itu, meski sebenarnya bisa dibagi.","Nilai diriku terasa naik-turun mengikuti pencapaian atau pengakuan yang kudapat.","Aku menahan pendapat atau perasaanku demi menjaga suasana tetap nyaman.","Aku sulit melepaskan sesuatu kalau belum sesuai standar atau cara yang kubayangkan.","Aku berharap sebagian masalah hilang sendiri kalau aku tidak menyentuhnya dulu.","Aku sulit menerima pujian karena merasa hasilku masih kurang.","Aku merasa bersalah ketika beristirahat saat orang lain masih membutuhkanku.","Aku bekerja atau berusaha lebih keras dari yang dibutuhkan supaya dipandang berhasil.","Aku cemas kalau ada orang kecewa atau tidak suka padaku, dan itu memengaruhi keputusanku.","Aku sering membayangkan skenario terburuk, lalu menyiapkan banyak cara supaya itu tidak terjadi.","Aku menghindari membuka sesuatu (pesan, tagihan, percakapan) karena sudah membayangkan rasa tidak enaknya.","Aku merasa seharusnya aku sudah lebih jauh dari posisiku sekarang.","Aku sulit meminta bantuan karena merasa harus bisa menyelesaikannya sendiri.","Saat melihat orang lain lebih maju, aku merasa tertinggal dan terdorong mengejar, bukan sekadar terinspirasi.","Aku lebih mudah memikirkan kebutuhan orang lain daripada kebutuhanku sendiri.","Aku tidak tenang kalau tidak memegang kendali atas hasil pekerjaan atau orang di sekitarku.","Aku lebih mudah berpindah-pindah aktivitas daripada duduk diam bersama perasaan yang tidak nyaman.","Suara di kepalaku lebih sering menilai dan mengoreksiku daripada mendukungku.","Aku terbiasa menjadi “yang kuat”, sehingga jarang membiarkan orang lain melihat aku lelah atau kewalahan.","Aku sering menyadari pemicu (ucapan, situasi, perasaan) sesaat setelah pemicu itu muncul.","Aku bisa berhenti sejenak dan merasakan napas sebelum merespons situasi yang memicu.","Aku bisa melihat perasaan atau pikiranku tanpa langsung terbawa olehnya.","Aku mulai bisa membedakan “apa yang terjadi” dari “cerita yang kubuat tentangnya”."];

const P=[
{n:"Pola Pembuktian",q:"Harus terlihat mampu.",p:"Diremehkan, dibandingkan, dikritik di depan orang, atau melihat orang lain melaju lebih cepat.",r:"Membantah, tampil lebih keras, bekerja berlebihan, atau mengejar pengakuan.",c:"Aku baru berharga kalau berhasil dan diakui.",b:"Ambisi, ketekunan, dan standar yang membuatmu terus bertumbuh.",h:"Sulit merasa cukup, lelah tanpa tahu kenapa, hubungan yang diam-diam jadi ajang bersaing.",e:"Saat dorongan membuktikan diri muncul, berhenti sejenak. Satu napas perut. Tanya pelan: “Aku sedang ingin membuktikan apa — dan kepada siapa?” Tidak perlu jawaban yang benar. Cukup lihat.",d:"Kalau tidak ada yang melihat dan tidak ada yang menilai, apa yang akan kulakukan secara berbeda?"},
{n:"Pola Penyenang",q:"Takut tidak diterima.",p:"Potensi konflik, permintaan yang sulit ditolak, wajah kecewa atau nada suara orang yang berubah.",r:"Langsung bilang “iya”, menahan pendapat, minta maaf berlebihan, membaca suasana lebih dulu daripada merasakan diri sendiri.",c:"Aku aman kalau orang lain senang padaku.",b:"Peka, hangat, dan mudah membuat orang lain merasa nyaman.",h:"Kelelahan yang tidak terlihat, kesal yang dipendam, kebutuhan sendiri yang terus tertunda.",e:"Sebelum menjawab “iya”, ambil satu napas dan jeda. Tanya: “Aku sebenarnya mau apa?” Kamu tidak harus langsung berkata “tidak”. Memberi dirimu jeda sudah cukup.",d:"Apa yang selama ini kutahan supaya semua orang tetap nyaman?"},
{n:"Pola Pengendali",q:"Harus aman dan teratur.",p:"Ketidakpastian, rencana yang berubah, hasil yang tidak bisa diprediksi, atau orang lain yang tidak sesuai standarmu.",r:"Mengambil alih, mengecek berulang, menyiapkan banyak skenario, atau tegang saat tidak bisa memegang kendali.",c:"Kalau tidak kukendalikan, semuanya akan kacau.",b:"Teliti, terstruktur, dan bisa diandalkan menjaga kualitas.",h:"Tubuh yang tegang, sulit mempercayai orang lain, sulit menikmati proses atau memulai sebelum “siap”.",e:"Saat ingin mengambil alih, lepaskan bahu dan rasakan napas perut. Tanya: “Mana yang benar-benar bisa kupengaruhi sekarang?” Lalu kerjakan hanya bagian itu.",d:"Kalau aku melepas satu hal kecil hari ini, apa yang sebenarnya paling kutakutkan akan terjadi?"},
{n:"Pola Penghindar",q:"Menjauh dari yang tidak nyaman.",p:"Tugas besar, percakapan yang sulit, ketidakjelasan, atau rasa tidak enak di badan.",r:"Menunda, membuka HP, menyibukkan diri dengan hal lain, mengalihkan topik, atau menghilang sementara.",c:"Nanti saja. Siapa tahu hilang sendiri.",b:"Pandai mengambil jarak dan tidak mudah terseret drama.",h:"Masalah menumpuk, rasa bersalah, dan peluang yang lewat karena belum berani dibuka.",e:"Sebelum meraih HP atau mengalihkan diri, ambil satu napas perut dan jeda. Tanya: “Aku sedang menjauh dari rasa apa?” Tetaplah bersama rasa itu beberapa napas — tidak perlu menyelesaikan apa pun.",d:"Satu hal apa yang sudah lama kuhindari — dan seperti apa rasanya kalau aku melihatnya apa adanya?"},

{n:"Pola Pemikul",q:"Semua biar aku saja.",p:"Orang lain kewalahan, tanggung jawab yang tidak jelas, atau permintaan tolong yang datang saat kamu sudah lelah.",r:"Mengambil alih beban, tidak meminta bantuan, menahan lelah, dan merasa bersalah saat beristirahat.",c:"Aku harus kuat. Kalau bukan aku, siapa lagi?",b:"Dapat diandalkan, peduli, dan tangguh di saat sulit.",h:"Kelelahan yang menumpuk, kesal yang tak diungkapkan, sulit menerima bantuan atau perhatian.",e:"Sebelum menyanggupi atau mengambil sesuatu, ambil satu napas dan jeda. Tanya: “Ini memang bebanku, atau beban yang bisa dibagi?”",d:"Kalau aku berhenti menjadi “yang kuat” selama satu hari, apa yang akan terjadi — dan apa yang kutakutkan terjadi?"}];
const J=[
{t:"Ruang Jeda Masih Tipis",x:"Reaksi sering berjalan lebih cepat daripada kesadaran, dan kamu baru melihatnya setelah selesai. Ini titik awal yang sangat umum — dan bisa dilatih. Mulailah dari jeda napas sederhana dan perhatikan satu pemicu saja."},
{t:"Ruang Jeda Mulai Terbentuk",x:"Kadang kamu sempat berhenti dan melihat, kadang tidak. Kuncinya konsistensi: memperbanyak momen kecil di mana kamu hadir sebelum merespons."},
{t:"Ruang Jeda Sudah Cukup Terasa",x:"Kamu cukup sering bisa melihat sebelum bereaksi. Tantangan berikutnya bukan sekadar melihat, tetapi memilih respons baru dan menjaganya tetap konsisten."}];

const $=document.getElementById("app");

function start(){i=-1;A.fill(0);$.innerHTML=`<span class="tag">Reset Test · Edisi Pola</span><h1>Pola Apa yang Sedang Mengambil Alih?</h1><p class="mu">Tes reflektif untuk mengenali pola respons otomatismu — dan seberapa luas ruang jeda yang sudah kamu punya.</p><p class="quote">“Jangan percaya hasilnya begitu saja. Amati dirimu sendiri.”</p><div class="card"><h3>Bukan diagnosis. Ini alat refleksi.</h3><p class="small">Tes ini bukan diagnosis psikologis, bukan label kepribadian, dan bukan ukuran nilai dirimu. Setiap orang punya semua pola ini sampai taraf tertentu. Jawablah berdasarkan apa yang paling sering benar-benar terjadi akhir-akhir ini — bukan versi dirimu yang kamu inginkan.</p><p class="small mu">28 pernyataan · 6 pola · ± 10 menit</p></div><div class="card"><span class="tag">100% gratis</span><h3>Isi dulu, lalu mulai</h3><p class="small"><b>Gratis, tanpa biaya dan tanpa pembayaran apa pun.</b> Hasil lengkap dan PDF-nya langsung kamu dapat setelah tes selesai. Nama dan nomor WhatsApp hanya untuk mengirim materi dan memungkinkan Admin menyapa bila kamu setuju.</p>
<input id="nm" class="inp" placeholder="Nama panggilan" autocomplete="given-name"><input id="kt" class="inp" type="tel" inputmode="tel" placeholder="Nomor WhatsApp" autocomplete="tel">

function next(){i++;i<28?ask():result()}
function ask(){const sec=i<24?"Bagian A · Pola Respons Otomatis":"Bagian B · Ruang Jeda";
$.innerHTML=`<div class="row mu"><span>${sec}</span><span>${i+1} / 28</span></div><div class="bar"><i style="width:${i/28*100}%"></i></div><div class="card"><p class="q">${Q[i]}</p><div class="opts">${L.map((l,k)=>`<button class="opt ${A[i]==k+1?'on':''}" onclick="pick(${k+1})"><b>${k+1}</b>${l}</button>`).join("")}</div></div>${i>0?'<button class="btn alt" onclick="back()">← Kembali</button>':''}`}
function pick(v){A[i]=v;setTimeout(next,200)}
function back(){i--;ask()}

const CFG={
 FORM_URL:"",   // contoh: https://docs.google.com/forms/d/e/XXXX/formResponse
 NAMA_ENTRY:"", // contoh: entry.123456789
 WA_ENTRY:""    // contoh: entry.987654321
};

let SC=null,NAMA="";
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const detail=(x,role)=>{const p=P[x.k];return `<div class="card"><span class="tag">${role} · ${x.s}/20</span><h2>${p.n}</h2><p class="quote">“${p.q}”</p>

function begin(){
const n=document.getElementById("nm").value.trim(),k=document.getElementById("kt").value.trim(),er=document.getElementById("er");
if(!n){er.textContent="Tulis nama panggilanmu dulu.";return}
if(k.replace(/\D/g,"").length<9){er.textContent="Isi nomor WhatsApp yang valid.";return}

function result(){

$.innerHTML=`<span class="tag">Hasilmu · ${esc(NAMA)}</span><h1>${flat?"Belum ada pola yang menonjol":"Pola Utamamu: "+P[sorted[0].k].n}</h1>

<div class="card"><span class="tag">Gratis</span><h3>Simpan hasilmu sebagai PDF</h3><button class="btn" onclick="dlpdf()">Unduh PDF hasilku</button></div>

<p class="quote small">“Jangan percaya aku. Amati dirimu sendiri.” — Alif Azzuhry · Praktisi Kesadaran</p>`;
window.scrollTo(0,0)}

async function dlpdf(){
const d=new window.jspdf.jsPDF({unit:"mm",format:"a4"});let y=20;
const T=(t,sz,b,gap)=>{d.setFont("helvetica",b?"bold":"normal");d.setFontSize(sz);d.splitTextToSize(t,170).forEach(l=>{if(y>280){d.addPage();y=20}d.text(l,20,y);y+=sz*0.5});y+=gap==null?2:gap};
const{S,jeda,sorted,flat,ji}=SC;
T("RESET TEST · EDISI POLA · SUARA KESADARAN ID",9,1,4);
T("Hasil Reset Test"+(NAMA?" — "+NAMA:""),20,1,2);
T(new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}),10,0,6);
T("Tes ini adalah alat refleksi, bukan diagnosis psikologis.",10,0,6);

S.forEach(o=>T(P[o.k].n+": "+o.s+"/20 ("+lvl(o.s)+")",11,0,1));

else[[sorted[0],"POLA UTAMA"],[sorted[1],"POLA PENDAMPING"]].forEach(([x,r])=>{const p=P[x.k];
T(r+" · "+x.s+"/20",9,1,1);T(p.n,16,1,1);T("“"+p.q+"”",11,0,3);
[["Pemicu",p.p],["Respons otomatis",p.r],["Cerita identitas","“"+p.c+"”"],["Sisi baiknya",p.b],["Harga yang sering menyertai",p.h],["Eksperimen 30 detik",p.e],["Untuk direnungkan",p.d]].forEach(([a,b])=>{T(a,10,1,0);T(b,11,0,3)});
